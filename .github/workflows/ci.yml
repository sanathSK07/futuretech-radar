name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RADAR_DATABASE_URL: postgresql+psycopg://radar:radar@localhost:5432/radar
  RADAR_TEST_DATABASE_URL: postgresql+psycopg://radar:radar@localhost:5432/radar_test
  RADAR_ENVIRONMENT: ci

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Same image as infra/docker-compose.yml, so CI and local development
        # cannot disagree about the PostgreSQL or pgvector version.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the test database
        run: |
          PGPASSWORD=radar psql -h localhost -U radar -d radar \
            -c 'CREATE DATABASE radar_test OWNER radar'

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: |
          .venv/bin/ruff check --output-format=github .
          .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/mypy

      - name: Migrate
        run: .venv/bin/alembic upgrade head

      - name: Check for model/migration drift
        run: .venv/bin/alembic check

      - name: Test
        run: .venv/bin/pytest

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Audit dependencies for known vulnerabilities
        run: |
          uv venv --python 3.12
          uv pip install pip-audit
          # Audit the resolved third-party dependency set. Auditing the
          # environment instead would fail under --strict, because this project
          # is installed as an editable distribution that is not on PyPI.
          uv pip compile pyproject.toml -o requirements.audit.txt
          .venv/bin/pip-audit --strict --progress-spinner off -r requirements.audit.txt
