- id: 25c311b7-b00c-4144-9543-aea02516d55f
  external_id: '2609.20443'
  title: 'Spatial-Semantic Uncertainty in VLM-Based Target Search: Balancing Exploration and
    Identification'
  url: https://arxiv.org/abs/2609.20443
  domains:
  - robotics
  abstract: Robots searching for a target from a natural-language description must determine
    not only where to search, but also which observed candidate is the desired target. These
    decisions reflect two distinct sources of uncertainty - spatial uncertainty over candidate
    locations and semantic uncertainty over target identity - that are often conflated in
    VLM-based search systems. We introduce a spatial-semantic uncertainty formulation that
    maintains separate beliefs over each component and integrates probabilistic VLM evidence
    into a global target-identity posterior, including probability mass for undiscovered targets.
    This decomposition allows an information-theoretic planner to independently value candidate
    discovery and target disambiguation through spatial and semantic expected information
    gain (EIG), providing an explicit mechanism for trading broader exploration against earlier
    identification. We evaluate six VLM uncertainty-elicitation interfaces on 500 synthetic
    targets and show that similar recognition accuracy can conceal substantial differences
    in calibration and false confidence. In degraded-observation search-and-identify experiments,
    EIG-based planners reach confident decisions in 75.0%-92.5% of trials, compared with 20.0%
    for Random search, while different spatial-semantic weightings achieve comparable identification
    accuracy once confidence is attained. Increasing semantic emphasis reduces unnecessary
    exploration and VLM queries, demonstrating that explicitly planning over semantic uncertainty
    can accelerate target resolution without sacrificing decision quality. These results highlight
    the distinct roles of uncertainty representation and uncertainty-driven planning in embodied
    VLM systems.
