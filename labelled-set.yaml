- id: 732649ed-eada-41d6-a3b5-3b53c1727f64
  external_id: '2609.20629'
  title: RTK-Vision PPO for Autonomous Micro UAV Recovery on an Airborne Carrier
  url: https://arxiv.org/abs/2609.20629
  domains:
  - robotics
  abstract: Autonomous recovery of a micro unmanned aerial vehicle (UAV) onto a moving airborne
    carrier enables reusable deploy-mission-recover operation, but couples long-range rendezvous,
    close-range perception, carrier motion, aerodynamic interaction, and a discontinuous contact
    event. This paper presents an RTK-vision-guided reinforcement-learning framework in which
    a child UAV is physically transported by a larger carrier, takes off from the carrier
    while airborne, executes an independent sortie, returns to the carrier's current position,
    redocks, and subsequently descends with the carrier. Both vehicles carry RTK-GNSS, and
    the carrier continuously shares its navigation state with the child. Near the recovery
    deck, RTK remains active while a downward-facing camera with a fiducial marker detector
    provides marker-relative alignment cues. A proximal policy optimization (PPO) policy governing
    the terminal recovery phase is trained in a physics-based MuJoCo simulation environment
    with explicit sensor noise models, an aerodynamic disturbance surrogate, and marker-latency
    randomization, then transferred to hardware. PX4 retains low-level stabilization, and
    a deterministic safety gate authorizes descent independently of the learned policy. The
    PPO checkpoint achieves 99.55% success over 2,000 held-out randomized terminal episodes,
    compared with 78.4% for a tuned PD baseline under identical conditions, with a median
    planar terminal error of 6.62 cm. Across 14 outdoor trials, the full mission succeeds
    in 13 trials (92.9%), spanning both near-region recovery and recovery after the carrier
    translates away from the release point. The results demonstrate a complete autonomous
    aerial deployment-and-recovery cycle rather than an isolated landing maneuver, establishing
    a practical basis for reusable carrier-child operation in inspection, surveillance, and
    mobile-logistics applications.
