- id: 710a6734-913b-4690-b168-d19cdcf18c54
  external_id: '2609.20618'
  title: Spin-Lattice Dynamics and Interactions in Magnonic Spinels
  url: https://arxiv.org/abs/2609.20618
  domains:
  - energy
  - semiconductors
  abstract: Minimizing magnetic damping while understanding spin-lattice interactions remains
    a key challenge for magnonics. We show site-specific Al/Li ordering in spinel ferrites
    drives a ferrimagnetic insulating state, quenching the Fermi-level density of states.
    \textit{Ab initio} calculations reveal collective acoustic modes alongside sub-lattice-selective
    optical modes on tetrahedral and octahedral networks, providing a microscopic understanding
    of substitution-driven spin dynamics. Crucially, the low-frequency magnon and acoustic
    phonon modes intersect, driving strong hybridization for low-loss technologies.
