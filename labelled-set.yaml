- id: 429c876e-6245-4ea1-8c25-4bedb44be3cd
  external_id: '2609.20616'
  title: Magnon-Phonon Dynamics in Multidimensional Antiferromagnetic Oxides
  url: https://arxiv.org/abs/2609.20616
  domains:
  - energy
  - semiconductors
  abstract: Antiferromagnetic oxides offer a compelling paradigm for magnonics. Combining
    ab initio and spin Hamiltonian modeling, we map Cr2O3 from bulk to monolayer limits, verifying
    stability via phonon spectra. Contrary to previously predicted half-metallic ferromagnetic
    monolayer phases, we conclusively demonstrate that monolayer and bilayer configurations
    preserve an antiferromagnetic semiconductor ground state despite systematic gap narrowing.
    Intersecting magnon and phonon branches drive strong hybridization, establishing low-dimensional
    Cr2O3 as an ideal platform for quantum spintronics.
