- id: 5eb634c7-d645-47cc-b282-7f560caf8e29
  external_id: '2609.20690'
  title: A counterexample to the quantum Hedetniemi conjecture
  url: https://arxiv.org/abs/2609.20690
  domains:
  - quantum
  abstract: 'Godsil, Roberson, Šámal and Severini conjectured that the quantum chromatic number
    of the categorical product of two graphs equals the minimum of the quantum chromatic numbers
    of the factors. We disprove this conjecture: we construct explicit finite graphs $G,H$
    with \[ χ(G\times H) \leq 1538 < 1539 = \min(χ_q(G),χ_q(H)).\]The graphs are obtained
    from Zhu''s counterexample to Hedetniemi''s conjecture by using a base graph for which
    the Lovász theta number of the complement, and not only the fractional chromatic number,
    is large. The lower bound for the first factor is the theta bound. For the second factor
    we adapt Zhu''s argument to projections that do not commute: the step that fixes the colors
    of a clique is replaced by identities between operators. Both lower bounds hold for colorings
    by projections in an arbitrary nonzero unital $C^*$-algebra. Hence the conjecture also
    fails for the spatial, approximate, commuting-operator and $C^*$-algebraic variants of
    the quantum chromatic number. We also give smaller counterexamples certified by exact
    integer data. The graph constructions, the certificates and the counterexample statements
    in the projective formulation are formalized in Lean~4.'
