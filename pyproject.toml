[project]
name = "futuretech-radar"
version = "0.1.0"
description = "Evidence-graded intelligence platform for emerging technologies"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "defusedxml>=0.7.1",
    "anthropic>=0.40",
]

[project.scripts]
radar = "radar.pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["N999", "E501"]
# RUF001 flags characters that can be confused with ASCII. This module's
# entire purpose is mapping those characters to their ASCII equivalents, so
# every one of them has to appear in it literally.
"src/radar/pipeline/grounding.py" = ["RUF001"]
# The same applies to the tests that feed it those characters.
"tests/test_grounding.py" = ["RUF001"]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []
mypy_path = "src"
packages = ["radar"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout: put the package on sys.path explicitly rather than relying on the
# editable install's .pth file resolving in every environment. The repository
# root comes too, so tests import shared fixtures as "tests.helpers" rather than
# a bare "helpers" that could shadow something on sys.path.
pythonpath = ["src", "."]
# -ra summarises skips and failures; without it a skipped suite looks identical
# to a passing one.
addopts = "--strict-markers -ra"
markers = ["db: requires a live PostgreSQL with pgvector"]
