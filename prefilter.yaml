# The triage gate's vocabulary.
#
# This file decides which stored documents are ever shown to a model. It is data
# rather than code so it can be tuned without a deploy, and it is reviewed
# through pull requests for the same reason sources.yaml is: every term here is
# a judgement about what counts as evidence.
#
# Two conditions must BOTH hold for a document to pass:
#
#   1. it mentions at least one term from some domain, and
#   2. it carries at least one claim signal — something that looks like an
#      assertion about the world rather than a method or a proof.
#
# Condition 2 is the one that matters. The first labelling export showed every
# sampled arXiv document was a method or theory paper: "quantum" appears in
# thousands of papers a month that contain no capability claim at all, and
# paying a model to read them is the single largest avoidable cost in this
# project. A domain-term gate alone would pass nearly all of them.
#
# What this file must never become: a list of technology names. Terms are
# generic domain vocabulary. Naming specific technologies here would make the
# gate reject anything new, which is the opposite of what a radar is for.
#
# rule_version is derived from this file's content hash, not written by hand —
# a hand-bumped version is a version somebody forgets to bump.
#
# The gate is deliberately generous, because the two errors do not cost the same.
# A false positive costs one model call. A false negative means a real piece of
# evidence is never looked at, and nothing in the system will ever tell us. So
# where a term is ambiguous it stays in.
#
# Known ambiguous terms, kept on purpose:
#   yield       - a core semiconductor metric, also an agricultural one. A wine
#                 harvest report passes this gate. Pinned as a test so the
#                 behaviour is visible rather than surprising.
#   cell        - matched only as "cell chemistry" and "cell-free" for this
#                 reason; bare "cell" would match most of biology.
#   node        - a process node, also a graph node. Common in AI papers.
#   agent       - a software agent, also a chemical one.
#   inference   - model inference, also statistical inference.
#   record      - a claim signal, also "records show" and "record keeping".

