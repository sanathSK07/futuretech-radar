# A claim signal is something that reads like an assertion about the world:
# a thing that was done, built, measured, shipped, or permitted.
#
# Deliberately NOT here: "propose", "framework", "we study", "novel approach",
# "outperforms" — the vocabulary of a method paper. A paper that only proposes
# is not evidence that anything exists yet.
claim_signals:
  demonstration:
    - demonstrat
    - we achieved
    - achieves a
    - achieved a
    - measured
    - observed
    - realiz
    - realis
    - fabricat
    - built a
    - operated
    - sustained
    - maintained for
    - ran for
    - first time

  deployment:
    - deployed
    - in production
    - commercial
    - shipped
    - available to customers
    - pilot plant
    - manufactur
    - at scale
    - installed
    - grid-connected
    - in service

  regulatory:
    - approved by
    - certified
    - clearance
    - licence application
    - license application
    - regulatory approval
    - authoris
    - authoriz
    - submitted to the

  record:
    - record
    - highest
    - longest
    - state of the art
    - previous best
    - milestone
    - breakthrough
