# FutureTech Radar — source registry.
#
# Adding a source is a judgement about evidence quality, so changes go through a
# pull request. Every entry declares the tier that governs what its documents may
# support (docs/02 section D.2) and the licence terms we operate under.
#
# tier: T1 primary/verifiable · T2 primary but self-interested
#       T3 reputable secondary · T4 discovery only
#
# Sprint 0 implements the arxiv_category fetcher. Entries for other kinds are
# declared but inactive until their fetcher lands in Sprint 1; the ingest command
# skips inactive sources.

sources:
  # ---------------------------------------------------------------- AI / ML ---
  - id: arxiv-cs-ai
    name: arXiv cs.AI (Artificial Intelligence)
    kind: arxiv_category
    tier: T1
    params: { category: cs.AI }
    domains: [ai]
    licence: "metadata CC0; e-prints link-only, never redistributed"
    rate_limit: { requests_per_second: 0.333 }

  - id: arxiv-cs-lg
    name: arXiv cs.LG (Machine Learning)
    kind: arxiv_category
    tier: T1
    params: { category: cs.LG }
    domains: [ai]
    licence: "metadata CC0; e-prints link-only, never redistributed"
    rate_limit: { requests_per_second: 0.333 }

  - id: arxiv-cs-cl
    name: arXiv cs.CL (Computation and Language)
    kind: arxiv_category
    tier: T1
    params: { category: cs.CL }
    domains: [ai]
    licence: "metadata CC0; e-prints link-only, never redistributed"
    rate_limit: { requests_per_second: 0.333 }

  - id: arxiv-cs-ma
    name: arXiv cs.MA (Multiagent Systems)
    kind: arxiv_category
    tier: T1
    params: { category: cs.MA }
    domains: [ai]
    licence: "metadata CC0; e-prints link-only, never redistributed"
    rate_limit: { requests_per_second: 0.333 }

  # --------------------------------------------------------------- Robotics ---
