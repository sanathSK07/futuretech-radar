    name: arXiv quant-ph (Quantum Physics)
    kind: arxiv_category
    tier: T1
    params: { category: quant-ph }
    domains: [quantum]
    licence: "metadata CC0; e-prints link-only, never redistributed"
    rate_limit: { requests_per_second: 0.333 }

  # --------------------------------------------- Semiconductors / computing ---
  - id: arxiv-cs-ar
    name: arXiv cs.AR (Hardware Architecture)
    kind: arxiv_category
    tier: T1
    params: { category: cs.AR }
    domains: [semiconductors]
    licence: "metadata CC0; e-prints link-only, never redistributed"
    rate_limit: { requests_per_second: 0.333 }

  - id: arxiv-cs-et
    name: arXiv cs.ET (Emerging Technologies)
    kind: arxiv_category
    tier: T1
    params: { category: cs.ET }
    domains: [semiconductors]
    licence: "metadata CC0; e-prints link-only, never redistributed"
    rate_limit: { requests_per_second: 0.333 }

  # ----------------------------------------------------------------- Energy ---
  - id: arxiv-physics-plasm-ph
    name: arXiv physics.plasm-ph (Plasma Physics)
    kind: arxiv_category
    tier: T1
    params: { category: physics.plasm-ph }
    domains: [energy]
    licence: "metadata CC0; e-prints link-only, never redistributed"
    rate_limit: { requests_per_second: 0.333 }

  - id: arxiv-cond-mat-mtrl-sci
    name: arXiv cond-mat.mtrl-sci (Materials Science)
    kind: arxiv_category
    tier: T1
    params: { category: cond-mat.mtrl-sci }
    domains: [energy, semiconductors]
    licence: "metadata CC0; e-prints link-only, never redistributed"
    rate_limit: { requests_per_second: 0.333 }
    note: >-
      Broad category. Relevance filtering in Sprint 1 narrows this to batteries,
      superconductors and semiconductor materials.

  # ---------------------------------------------------------------- Biotech ---
  - id: arxiv-q-bio-bm
    name: arXiv q-bio.BM (Biomolecules)
    kind: arxiv_category
    tier: T1
    params: { category: q-bio.BM }
    domains: [biotech]
    licence: "metadata CC0; e-prints link-only, never redistributed"
    rate_limit: { requests_per_second: 0.333 }

  # --------------------------------------------------- Feeds and preprint APIs --
  # Activated in Sprint 1. These carry the evidence arXiv structurally cannot:
  # fusion milestones, battery deployments, regulatory decisions and product
  # launches are announced on newsrooms, not posted as preprints. The first real
  # labelling export made that concrete — energy and biotech had no documents at
  # all, and every arXiv document in the sample was a method or theory paper.

  - id: biorxiv-synthetic-biology
    name: bioRxiv — Synthetic Biology
    kind: biorxiv
    tier: T1
    params: { category: synthetic biology }
    domains: [biotech]
    licence: "metadata only; preprints link-only"
    rate_limit: { requests_per_second: 1.0 }
    note: >-
      The API has no category parameter, so the category is filtered after the
      fetch; a narrow category still costs a full walk of the window.

  - id: mit-news-research
    name: MIT News — Research
    kind: rss
    tier: T2
    params: { url: "https://news.mit.edu/rss/research" }
    domains: [ai, robotics, energy, biotech, quantum, semiconductors]
    licence: "excerpt and link only; no full-text republication"
    rate_limit: { requests_per_second: 0.5 }

  - id: deepmind-blog
    name: Google DeepMind — Blog
    kind: rss
    tier: T2
    params: { url: "https://deepmind.google/blog/rss.xml" }
    domains: [ai]
    licence: "excerpt and link only; no full-text republication"
    rate_limit: { requests_per_second: 0.5 }

  - id: doe-articles
    name: US Department of Energy — Articles
    kind: rss
    tier: T2
    params: { url: "https://www.energy.gov/rss-feeds" }
    domains: [energy]
    licence: "US government work; excerpt and link"
    rate_limit: { requests_per_second: 0.5 }

  # nrel-news was removed on 2026-09-22. The URL shipped for it was a guess
  # that does not exist, and NREL publishes no documented feed; guessing a
  # second one would repeat the mistake. An NREL source returns when a real
  # feed URL has been read off their site.

  - id: nrc-news
    name: US Nuclear Regulatory Commission — News
    kind: rss
    tier: T1
    params: { url: "https://www.nrc.gov/public-involve/listserver/rss/news-releases.xml" }
    domains: [energy]
    licence: "US government work; excerpt and link"
    rate_limit: { requests_per_second: 0.5 }
    active: false
    note: >-
      T1, not T2: a regulator's decision is a primary verifiable record, and this
      is the only source that could supply a regulatory_event claim for small
      modular reactors. Parked because the feed answered 503 from two
      independent networks on 2026-09-22 — re-test before reactivating rather
      than leaving a source that fails every nightly run.
