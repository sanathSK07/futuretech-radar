  # ------------------------------------------- Declared, fetcher not yet built --
  # These land in Sprint 1. They are kept here so the registry documents the full
  # intended coverage, and are inactive so ingest skips them rather than failing.

  - id: biorxiv-synthetic-biology
    name: bioRxiv — Synthetic Biology
    kind: biorxiv
    tier: T1
    params: { category: synthetic biology }
    domains: [biotech]
    licence: "metadata only; preprints link-only"
    active: false
    note: bioRxiv fetcher arrives in Sprint 1.

  - id: mit-news-research
    name: MIT News — Research
    kind: rss
    tier: T2
    params: { url: "https://news.mit.edu/rss/research" }
